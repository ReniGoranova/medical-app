<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Данни на пациента</title>

    <link rel="icon" type="image/png" href="/static/favicon.png">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="/static/style.css?v=1002">
</head>

<body>

    <a class="app-logo" onclick="goHome()">
        <img src="/static/logo.png" alt="Medical App" class="app-logo-img">
    </a>

    <div class="container patient-details-container">

        <div class="card shadow-lg border-0 rounded-4 patient-details-card">

            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center mb-4 patient-header">
                    <h1 class="text-primary mb-0">
                        Данни на пациента
                    </h1>

                    <button class="btn btn-outline-secondary patient-back-button" onclick="goBack()">
                        Назад
                    </button>
                </div>

                <div class="patient-choice-box">
                    <p class="mb-3 patient-intro">
                        За себе си ли запазвате този час или за друг човек?
                    </p>

                    <div class="form-check mb-2">
                        <input
                            class="form-check-input"
                            type="radio"
                            name="bookingFor"
                            id="forMe"
                            value="За себе си"
                            checked
                            onchange="handleBookingForChange()"
                        >

                        <label class="form-check-label" for="forMe">
                            За себе си
                        </label>
                    </div>

                    <div class="form-check mb-0">
                        <input
                            class="form-check-input"
                            type="radio"
                            name="bookingFor"
                            id="forOther"
                            value="За друг човек"
                            onchange="handleBookingForChange()"
                        >

                        <label class="form-check-label" for="forOther">
                            За друг човек
                        </label>
                    </div>
                </div>

                <div class="patient-fields-grid">

                    <div class="mb-4">
                        <label class="form-label">
                            Име и фамилия
                        </label>

                        <input
                            type="text"
                            id="patientName"
                            class="form-control"
                            placeholder="Име и фамилия"
                        >
                    </div>

                    <div class="mb-4">
                        <label class="form-label">
                            Телефон
                        </label>

                        <div class="input-group phone-input-group">
                            <span class="input-group-text">
                                +359
                            </span>

                            <input
                                type="tel"
                                id="patientPhone"
                                class="form-control"
                                placeholder="888123456"
                                inputmode="numeric"
                                pattern="[0-9]*"
                                maxlength="9"
                                autocomplete="tel"
                            >
                        </div>

                        <small class="text-muted">
                            Въведете 9 цифри, например: 888123456
                        </small>
                    </div>

                    <div class="mb-4 full-width">
                        <label class="form-label">
                            Бележка към резервацията
                        </label>

                        <textarea
                            id="note"
                            rows="5"
                            class="form-control"
                            placeholder="Напишете бележка към лекаря (не е задължително)"
                        ></textarea>
                    </div>

                </div>

                <div class="card border-0 bg-light rounded-4 mb-4 patient-summary-card">

                    <div class="card-body">

                        <h4 class="text-primary mb-3">
                            Данни за резервацията
                        </h4>

                        <p>
                            <strong>Лекар:</strong>
                            <span id="doctorName"></span>
                        </p>

                        <p>
                            <strong>Специалност:</strong>
                            <span id="doctorSpecialty"></span>
                        </p>

                        <p>
                            <strong>Дата:</strong>
                            <span id="appointmentDate"></span>
                        </p>

                        <p>
                            <strong>Час:</strong>
                            <span id="appointmentTime"></span>
                        </p>

                        <p>
                            <strong>Причина:</strong>
                            <span id="appointmentReason"></span>
                        </p>

                        <p>
                            <strong>Метод на плащане:</strong>
                            <span id="appointmentPayment"></span>
                        </p>

                    </div>

                </div>

                <button
                    id="finishBookingButton"
                    class="btn btn-success w-100 finish-booking-button"
                    onclick="finishBooking()"
                >
                    Завърши резервацията
                </button>

            </div>

        </div>

    </div>

    <script>
        const bookingData =
            JSON.parse(localStorage.getItem("bookingData"));

        const username = localStorage.getItem("username");

        let loggedUserData = null;

        if (!bookingData) {
            window.location.href = "/search";
        }

        if (!username) {
            window.location.href = "/";
        }

        if (bookingData) {
            document.getElementById("doctorName").innerText =
                bookingData.doctor_name || "";

            document.getElementById("doctorSpecialty").innerText =
                bookingData.specialty || "";

            document.getElementById("appointmentDate").innerText =
                bookingData.date || "";

            document.getElementById("appointmentTime").innerText =
                bookingData.time || "";

            document.getElementById("appointmentReason").innerText =
                bookingData.reason || "—";

            document.getElementById("appointmentPayment").innerText =
                bookingData.payment || "—";
        }

        function goHome() {
            window.location.href = "/search";
        }

        function goBack() {
            window.history.back();
        }

        function onlyNineDigits(value) {
            return value.replace(/\D/g, "").slice(0, 9);
        }

        function removeBulgarianPrefix(phone) {
            if (!phone) {
                return "";
            }

            return phone
                .replace("+359", "")
                .replace(/\D/g, "")
                .slice(0, 9);
        }

        async function loadLoggedUserData() {
            try {
                const response = await fetch(`/profile-data/${encodeURIComponent(username)}`);
                loggedUserData = await response.json();

                fillPatientDataFromProfile();
            } catch (error) {
                console.error(error);
            }
        }

        function fillPatientDataFromProfile() {
            if (!loggedUserData) {
                return;
            }

            const fullName =
                `${loggedUserData.first_name || ""} ${loggedUserData.last_name || ""}`.trim();

            document.getElementById("patientName").value = fullName;
            document.getElementById("patientPhone").value =
                removeBulgarianPrefix(loggedUserData.phone || "");
        }

        function clearPatientData() {
            document.getElementById("patientName").value = "";
            document.getElementById("patientPhone").value = "";
        }

        function handleBookingForChange() {
            const selectedOption =
                document.querySelector("input[name='bookingFor']:checked").value;

            if (selectedOption === "За себе си") {
                fillPatientDataFromProfile();
            } else {
                clearPatientData();
            }
        }

        const phoneInput = document.getElementById("patientPhone");

        phoneInput.addEventListener("input", function () {
            this.value = onlyNineDigits(this.value);
        });

        phoneInput.addEventListener("paste", function (event) {
            event.preventDefault();

            const pastedText = event.clipboardData.getData("text");
            this.value = onlyNineDigits(pastedText);
        });

        async function finishBooking() {
            const finishButton = document.getElementById("finishBookingButton");

            const patientName =
                document.getElementById("patientName").value.trim();

            const patientPhone =
                document.getElementById("patientPhone").value.trim();

            const note =
                document.getElementById("note").value.trim();

            const bookingFor =
                document.querySelector("input[name='bookingFor']:checked").value;

            const phonePattern = /^[0-9]{9}$/;

            if (patientName === "" || patientPhone === "") {
                alert("Попълни име и телефон");
                return;
            }

            if (!phonePattern.test(patientPhone)) {
                alert("Телефонният номер трябва да съдържа точно 9 цифри");
                return;
            }

            if (!username) {
                alert("Няма влязъл потребител. Моля, влезте отново.");
                window.location.href = "/";
                return;
            }

            if (
                !bookingData ||
                !bookingData.doctor_id ||
                !bookingData.date ||
                !bookingData.time
            ) {
                alert("Липсват данни за резервацията. Моля, изберете час отново.");
                window.location.href = "/search";
                return;
            }

            const fullPhone = "+359 " + patientPhone;

            const noteParts = [
                bookingData.patientType || "",
                bookingFor,
                note ? "Бележка: " + note : ""
            ];

            const appointmentNote = noteParts
                .filter(part => part && part.trim() !== "")
                .join("; ");

            const fullDateTime =
                `${bookingData.date} ${bookingData.time}`;

            try {
                finishButton.disabled = true;
                finishButton.innerText = "Записване...";

                const params = new URLSearchParams({
                    user: username,
                    doctor_id: bookingData.doctor_id,
                    time: fullDateTime,
                    reason: bookingData.reason || "",
                    payment_method: bookingData.payment || "",
                    appointment_patient_name: patientName,
                    appointment_patient_phone: fullPhone,
                    appointment_note: appointmentNote
                });

                const response = await fetch(`/appointments?${params.toString()}`, {
                    method: "POST"
                });

                const data = await response.json();

                alert(data.message);

                if (data.message === "Часът е записан успешно") {
                    localStorage.removeItem("bookingData");
                    window.location.href = "/my-profile";
                    return;
                }

                finishButton.disabled = false;
                finishButton.innerText = "Завърши резервацията";

            } catch (error) {
                console.error(error);

                alert("Възникна грешка при записването на часа.");

                finishButton.disabled = false;
                finishButton.innerText = "Завърши резервацията";
            }
        }

        loadLoggedUserData();
    </script>

</body>
</html>
