<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - Medical App</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="profile-button" onclick="openProfile()">

    <svg
        xmlns="http://www.w3.org/2000/svg"
        width="34"
        height="34"
        fill="currentColor"
        viewBox="0 0 16 16"
    >
        <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>

        <path
        fill-rule="evenodd"
        d="M8 9a5 5 0 0 0-5 5 .5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5 5 5 0 0 0-5-5z"/>
    </svg>

</div>

    <div class="container py-5">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h1 class="text-primary">
                Запазване на час при лекар
            </h1>

            <button class="btn btn-danger" onclick="logout()">
                Изход
            </button>

        </div>

        <div class="card shadow-lg border-0 rounded-4 mb-5">

            <div class="card-body p-4">

                <div class="row">

                    <div class="col-md-4">

                        <label class="form-label">
                            Избери дата
                        </label>

                        <input
                            type="date"
                            id="date"
                            class="form-control"
                        >

                    </div>

                    <div class="col-md-4">

                        <label class="form-label">
                            Избери час
                        </label>

                        <select
                            id="time"
                            class="form-select"
                        ></select>

                    </div>

                    <div class="col-md-4">

                        <label class="form-label">
                            Филтър по специалност
                        </label>

                        <select
                            id="specialtyFilter"
                            class="form-select"
                        >

                            <option value="">
                                Всички специалности
                            </option>

                            <option value="Кардиолог">Кардиолог</option>
                            <option value="Дерматолог">Дерматолог</option>
                            <option value="Ортопед">Ортопед</option>
                            <option value="Невролог">Невролог</option>
                            <option value="Педиатър">Педиатър</option>
                            <option value="УНГ">УНГ</option>
                            <option value="Офталмолог">Офталмолог</option>
                            <option value="Ендокринолог">Ендокринолог</option>
                            <option value="Алерголог">Алерголог</option>
                            <option value="Гастроентеролог">Гастроентеролог</option>
                            <option value="Хирург">Хирург</option>
                            <option value="Зъболекар">Зъболекар</option>

                        </select>

                    </div>

                </div>

                <div class="mt-4">

                    <input
                        type="text"
                        id="searchInput"
                        class="form-control"
                        placeholder="Търси лекар или специалност"
                    >

                </div>

            </div>

        </div>

        <h2 class="mb-4">
            Списък с лекари
        </h2>

        <div id="doctorsList" class="row gy-4 mb-5"></div>

        <h2 class="mb-4">
            Моите записани часове
        </h2>

        <ul
            id="appointmentsList"
            class="list-group"
        ></ul>

    </div>

    <script>
        const username = localStorage.getItem("username");

        if (!username) {
            window.location.href = "/";
        }

        const allTimes = [
            "09:00", "09:30", "10:00", "10:30",
            "11:00", "11:30", "12:00", "12:30",
            "13:00", "13:30", "14:00", "14:30",
            "15:00", "15:30", "16:00", "16:30",
            "17:00", "17:30", "18:00"
        ];

        let selectedDoctorId = null;

        function fillTimes(busyTimes = []) {
            const timeSelect = document.getElementById("time");
            timeSelect.innerHTML = "";

            allTimes.forEach(time => {
                if (!busyTimes.includes(time)) {
                    const option = document.createElement("option");
                    option.value = time;
                    option.textContent = time;
                    timeSelect.appendChild(option);
                }
            });

            if (timeSelect.options.length === 0) {
                const option = document.createElement("option");
                option.value = "";
                option.textContent = "Няма свободни часове";
                timeSelect.appendChild(option);
            }
        }

        async function updateAvailableTimes(doctorId) {
            selectedDoctorId = doctorId;

            const date = document.getElementById("date").value;

            if (date === "") {
                fillTimes();
                return;
            }

            const response = await fetch(
                `/busy-times?doctor_id=${doctorId}&date=${date}`
            );

            const busyTimes = await response.json();

            fillTimes(busyTimes);
        }

        async function loadDoctors() {
            const response = await fetch("/doctors");
            const data = await response.json();

            const list = document.getElementById("doctorsList");
            const searchText = document.getElementById("searchInput").value.toLowerCase();
            const selectedSpecialty = document.getElementById("specialtyFilter").value;

            list.innerHTML = "";

            data.forEach(doc => {
                const name = doc.name.toLowerCase();
                const specialty = doc.specialty.toLowerCase();

                const matchesSearch =
                    name.includes(searchText) ||
                    specialty.includes(searchText);

                const matchesSpecialty =
                    selectedSpecialty === "" ||
                    doc.specialty === selectedSpecialty;

                if (!matchesSearch || !matchesSpecialty) {
                    return;
                }

                const card = document.createElement("div");

                card.className = "col-md-6";

                card.innerHTML = `
                    <div class="card shadow border-0 rounded-4 h-100">
                        <div class="card-body">

                            <h4 class="text-primary">
                                ${doc.name}
                            </h4>

                            <p>
                                <strong>Специалност:</strong>
                                ${doc.specialty}
                            </p>

                            <p>
                                ${doc.description}
                            </p>

                            <p>
                                ⭐ ${doc.rating} / 5
                            </p>

                            <div class="d-flex gap-2 flex-wrap">

                                <button
                                    class="btn btn-primary"
                                    onclick="book(${doc.id})"
                                >
                                    Запази час
                                </button>

                                <button
                                    class="btn btn-outline-primary"
                                    onclick="updateAvailableTimes(${doc.id})"
                                >
                                    Свободни часове
                                </button>

                            </div>

                        </div>
                    </div>
                `;

                list.appendChild(card);
            });
        }

        async function book(doctorId) {
            const time = document.getElementById("time").value;
            const date = document.getElementById("date").value;

            if (date === "") {
                alert("Избери дата");
                return;
            }

            if (time === "") {
                alert("Няма свободни часове");
                return;
            }

            const fullDateTime = `${date} ${time}`;

            const response = await fetch(
                `/appointments?user=${username}&doctor_id=${doctorId}&time=${encodeURIComponent(fullDateTime)}`,
                {
                    method: "POST"
                }
            );

            const data = await response.json();

            alert(data.message);

            loadAppointments();

            updateAvailableTimes(doctorId);
        }

        async function loadAppointments() {
            const response = await fetch("/appointments");
            const data = await response.json();

            const list = document.getElementById("appointmentsList");
            list.innerHTML = "";

            data.forEach(app => {
                if (app.username !== username) return;

                const li = document.createElement("li");

                li.className =
                    "list-group-item d-flex justify-content-between align-items-center";

                li.innerHTML = `
                    <div>
                        <strong>${app.name}</strong>
                        <br>
                        ${app.time}
                    </div>

                    <button
                        class="btn btn-sm btn-danger"
                        onclick="deleteAppointment(${app.id})"
                    >
                        Изтрий
                    </button>
                `;

                list.appendChild(li);
            });
        }

        async function deleteAppointment(id) {
            const response = await fetch(
                `/appointments/${id}`,
                {
                    method: "DELETE"
                }
            );

            const data = await response.json();

            alert(data.message);

            loadAppointments();

            if (selectedDoctorId !== null) {
                updateAvailableTimes(selectedDoctorId);
            }
        }

        function logout() {
            localStorage.removeItem("username");
            window.location.href = "/";
        }

        document
            .getElementById("searchInput")
            .addEventListener("input", loadDoctors);

        document
            .getElementById("specialtyFilter")
            .addEventListener("change", loadDoctors);

        document
            .getElementById("date")
            .addEventListener("change", function () {
                if (selectedDoctorId !== null) {
                    updateAvailableTimes(selectedDoctorId);
                }
            });

        const today = new Date().toISOString().split("T")[0];
        document.getElementById("date").min = today;

        fillTimes();
        loadDoctors();
        loadAppointments();

        function openProfile() {
            window.location.href = "/my-profile";
        }

    </script>

</body>
</html>
