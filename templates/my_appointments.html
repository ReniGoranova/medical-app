<!DOCTYPE html>
<html>
<head>
    <title>Моите записани часове</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <link rel="stylesheet" href="/static/style.css?v=2">
</head>

<body>

    <div class="container py-5">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h1 class="text-primary">
                Моите записани часове
            </h1>

            <div class="d-flex gap-2">

                <button
                    class="btn btn-outline-primary"
                    onclick="goBack()"
                >
                    Назад
                </button>

                <button
                    class="btn btn-danger"
                    onclick="logout()"
                >
                    Изход
                </button>

            </div>

        </div>

        <div id="appointmentsContainer" class="row gy-4"></div>

    </div>

    <script>

        const username = localStorage.getItem("username");

        if (!username) {
            window.location.href = "/";
        }

        async function loadAppointments() {

            const response = await fetch(
                `/my-appointments-data?username=${username}`
            );

            const appointments = await response.json();

            const container =
                document.getElementById("appointmentsContainer");

            container.innerHTML = "";

            if (appointments.length === 0) {

                container.innerHTML = `
                    <div class="alert alert-warning">
                        Нямате записани часове.
                    </div>
                `;

                return;
            }

            appointments.forEach(app => {

                const card = document.createElement("div");

                card.className = "col-md-6";

                card.innerHTML = `

                    <div class="card shadow border-0 rounded-4 h-100">

                        <div class="card-body">

                            <h4 class="text-primary mb-3">
                                ${app.doctor_name}
                            </h4>

                            <p>
                                <strong>Специалност:</strong>
                                ${app.specialty}
                            </p>

                            <p>
                                <strong>Дата и час:</strong>
                                ${app.time}
                            </p>

                            <p>
                                <strong>Причина:</strong>
                                ${app.reason}
                            </p>

                            <p>
                                <strong>Град:</strong>
                                ${app.city}
                            </p>

                            <p>
                                <strong>Адрес:</strong>
                                ${app.address}
                            </p>

                            <p>
                                <strong>Телефон:</strong>
                                ${app.phone}
                            </p>

                            <button
                                class="btn btn-danger mt-3"
                                onclick="deleteAppointment(${app.id})"
                            >
                                Отмени часа
                            </button>

                        </div>

                    </div>

                `;

                container.appendChild(card);
            });
        }

        async function deleteAppointment(id) {

            const response = await fetch(
                `/appointments/${id}`,
                {
                    method: "DELETE"
                }
            );

            const data = await response.json();

            alert(data.message);

            loadAppointments();
        }

        function goBack() {
            window.location.href = "/search";
        }

        function logout() {

            localStorage.removeItem("username");

            window.location.href = "/";
        }

        loadAppointments();

    </script>

</body>
</html>
