<!DOCTYPE html>
<html>
<head>
    <title>Профил на лекар</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="profile-button" onclick="openProfile()">

    <svg
        xmlns="http://www.w3.org/2000/svg"
        width="34"
        height="34"
        fill="currentColor"
        viewBox="0 0 16 16"
    >
        <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>

        <path
        fill-rule="evenodd"
        d="M8 9a5 5 0 0 0-5 5 .5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5 5 5 0 0 0-5-5z"/>
    </svg>

</div>

    <div class="container py-5">

        <div class="d-flex justify-content-between mb-4">
            <button class="btn btn-outline-secondary" onclick="goBack()">
                Назад
            </button>

            <button class="btn btn-danger" onclick="logout()">
                Изход
            </button>
        </div>

        <div class="card shadow-lg border-0 rounded-4 mb-4">
            <div class="card-body p-4">

                <h1 id="doctorName" class="text-primary mb-3"></h1>

                <div class="doctor-info-grid">

                    <div class="doctor-info-item">
                        <strong>Специалност:</strong>
                        <span id="specialty"></span>
                    </div>

                    <div class="doctor-info-item">
                        <strong>Град:</strong>
                        <span id="city"></span>
                    </div>

                    <div class="doctor-info-item">
                        <strong>Адрес:</strong>
                        <span id="address"></span>
                    </div>

                    <div class="doctor-info-item">
                        <strong>Телефон:</strong>
                        <span id="phone"></span>
                    </div>

                    <div class="doctor-info-item">
                        <strong>Рейтинг:</strong>
                        ⭐ <span id="rating"></span> / 5
                    </div>

                    <div class="doctor-info-item">
                        <strong>Опит:</strong>
                        <span id="experience"></span>
                    </div>

                </div>

                <div class="mt-4">
                    <iframe
                        id="mapFrame"
                        width="100%"
                        height="300"
                        style="border:0; border-radius: 16px;"
                        loading="lazy"
                        allowfullscreen>
                    </iframe>
                </div>

            </div>
        </div>

        <div class="card shadow border-0 rounded-4 mb-4">
            <div class="card-body p-4">

                <h2>Информация за лекаря</h2>

                <div class="doctor-section">

    <h5 class="doctor-section-title">
        Описание
    </h5>

    <p id="description" class="doctor-section-text"></p>

</div>

<div class="doctor-section">

    <h5 class="doctor-section-title">
        Образование
    </h5>

    <p id="education" class="doctor-section-text"></p>

</div>

<div class="doctor-section">

    <h5 class="doctor-section-title">
        Квалификации
    </h5>

    <ul id="qualifications" class="qualification-list"></ul>

</div>

<div class="doctor-section">

    <h5 class="doctor-section-title">
        Биография
    </h5>

    <p id="biography" class="doctor-section-text"></p>

</div>

            </div>
        </div>

        <div class="card shadow border-0 rounded-4 mb-4">
            <div class="card-body p-4">

                <h2 class="mb-4">Запазване на час</h2>

                <label class="form-label">Дата:</label>
                <input type="date" id="date" class="form-control mb-3">

                <label class="form-label">Свободни часове:</label>
                <div id="timeSlots" class="time-slots mb-3"></div>
                <input type="hidden" id="selectedTime">

                <button class="btn btn-primary" onclick="bookAppointment()">
                    Запази час
                </button>

            </div>
        </div>

        <div class="card shadow border-0 rounded-4 mb-4">
            <div class="card-body p-4">

                <h2 class="mb-4">Остави отзив</h2>

                <label class="form-label">Оценка:</label>
                <select id="reviewRating" class="form-select mb-3">
                    <option value="5">5 ⭐</option>
                    <option value="4">4 ⭐</option>
                    <option value="3">3 ⭐</option>
                    <option value="2">2 ⭐</option>
                    <option value="1">1 ⭐</option>
                </select>

                <textarea
                    id="reviewComment"
                    rows="4"
                    class="form-control mb-3"
                    placeholder="Напишете коментар за лекаря"
                ></textarea>

                <button class="btn btn-success" onclick="addReview()">
                    Добави отзив
                </button>

            </div>
        </div>

        <div class="card shadow border-0 rounded-4">
            <div class="card-body p-4">

                <h2 class="mb-4">Отзиви от пациенти</h2>

                <ul id="reviewsList" class="list-group"></ul>

            </div>
        </div>

    </div>

    <script>
        const username = localStorage.getItem("username");

        if (!username) {
            window.location.href = "/";
        }

        const doctorId = window.location.pathname.split("/").pop();

        const allTimes = [
            "09:00", "09:30", "10:00", "10:30",
            "11:00", "11:30", "12:00", "12:30",
            "13:00", "13:30", "14:00", "14:30",
            "15:00", "15:30", "16:00", "16:30",
            "17:00", "17:30", "18:00"
        ];

        let selectedTime = "";

        function fillTimes(busyTimes = []) {
            const timeSlots = document.getElementById("timeSlots");
            timeSlots.innerHTML = "";
            selectedTime = "";
            document.getElementById("selectedTime").value = "";

            allTimes.forEach(time => {
                const button = document.createElement("button");

                button.textContent = time;
                button.type = "button";

                if (busyTimes.includes(time)) {
                    button.className = "time-slot busy";
                    button.disabled = true;
                } else {
                    button.className = "time-slot free";

                    button.onclick = function () {
                        selectedTime = time;
                        document.getElementById("selectedTime").value = time;

                        document.querySelectorAll(".time-slot.free").forEach(btn => {
                            btn.classList.remove("selected");
                        });

                        button.classList.add("selected");
                    };
                }

                timeSlots.appendChild(button);
            });
        }

        async function loadDoctor() {
            const response = await fetch(`/doctor-data/${doctorId}`);
            const doctor = await response.json();

            document.getElementById("doctorName").innerText = doctor.name;
            document.getElementById("specialty").innerText = doctor.specialty;
            document.getElementById("city").innerText = doctor.city;
            document.getElementById("address").innerText = doctor.address;
            document.getElementById("phone").innerText = doctor.phone;
            document.getElementById("rating").innerText = doctor.rating;
            document.getElementById("experience").innerText = doctor.experience;

            const fullAddress = `${doctor.address}, ${doctor.city}, България`;
            const mapUrl = `https://www.google.com/maps?q=${encodeURIComponent(fullAddress)}&output=embed`;
            document.getElementById("mapFrame").src = mapUrl;

            document.getElementById("description").innerText = doctor.description;
            document.getElementById("education").innerText = doctor.education;
            const qualificationsList =
    document.getElementById("qualifications");

qualificationsList.innerHTML = "";

if (doctor.qualifications) {

    const qualifications =
        doctor.qualifications.split(";");

    qualifications.forEach(item => {

        if (item.trim() !== "") {

            qualificationsList.innerHTML += `
                <li>${item.trim()}</li>
            `;
        }
    });
}
            document.getElementById("biography").innerText = doctor.biography;
        }

        async function updateAvailableTimes() {
            const date = document.getElementById("date").value;

            if (date === "") {
                fillTimes();
                return;
            }

            const response = await fetch(`/busy-times?doctor_id=${doctorId}&date=${date}`);
            const busyTimes = await response.json();

            fillTimes(busyTimes);
        }

        async function bookAppointment() {
            const date = document.getElementById("date").value;
            const time = document.getElementById("selectedTime").value;

            if (date === "") {
                alert("Избери дата");
                return;
            }

            if (time === "") {
                alert("Избери свободен час");
                return;
            }

            const response = await fetch(`/doctor-data/${doctorId}`);
            const doctor = await response.json();

            const bookingData = {
                username: username,
                doctor_id: doctorId,
                doctor_name: doctor.name,
                specialty: doctor.specialty,
                city: doctor.city,
                address: doctor.address,
                phone: doctor.phone,
                rating: doctor.rating,
                experience: doctor.experience,
                date: date,
                time: time
            };

            localStorage.setItem("bookingData", JSON.stringify(bookingData));

            window.location.href = "/booking-details";
        }

        async function addReview() {
            const rating = document.getElementById("reviewRating").value;
            const comment = document.getElementById("reviewComment").value;

            const response = await fetch("/reviews", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: username,
                    doctor_id: Number(doctorId),
                    rating: Number(rating),
                    comment: comment
                })
            });

            const data = await response.json();

            alert(data.message);

            document.getElementById("reviewComment").value = "";

            loadReviews();
        }

        async function loadReviews() {
            const response = await fetch(`/reviews/${doctorId}`);
            const reviews = await response.json();

            const list = document.getElementById("reviewsList");
            list.innerHTML = "";

            if (reviews.length === 0) {
                list.innerHTML = `
                    <li class="list-group-item">
                        Все още няма отзиви за този лекар.
                    </li>
                `;
                return;
            }

            reviews.forEach(review => {
                const li = document.createElement("li");

                li.className = "list-group-item";

                li.innerHTML = `
                    <strong>${review.username}</strong>
                    <span class="text-warning">${review.rating} ⭐</span>
                    <br>
                    ${review.comment}
                `;

                list.appendChild(li);
            });
        }

        function goBack() {
            window.location.href = "/search";
        }

        function logout() {
            localStorage.removeItem("username");
            window.location.href = "/";
        }

        document.getElementById("date").addEventListener("change", updateAvailableTimes);

        const today = new Date().toISOString().split("T")[0];
        document.getElementById("date").min = today;

        fillTimes();
        loadDoctor();
        loadReviews();

        function openProfile() {
            window.location.href = "/my-profile";
        }

    </script>

</body>
</html>
