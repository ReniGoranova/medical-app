<!DOCTYPE html>
<html>
<head>
    <title>Търсене на специалист</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="profile-button" onclick="openProfile()">

    <svg
        xmlns="http://www.w3.org/2000/svg"
        width="34"
        height="34"
        fill="currentColor"
        viewBox="0 0 16 16"
    >
        <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>

        <path
        fill-rule="evenodd"
        d="M8 9a5 5 0 0 0-5 5 .5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5 5 5 0 0 0-5-5z"/>
    </svg>

</div>

    <div class="container py-5">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h1 class="text-primary">
                Намери лекар
            </h1>

            <div class="d-flex gap-2">

   
    <button
        class="btn btn-danger"
        onclick="logout()"
    >
        Изход
    </button>

</div>

        </div>

        <div class="card shadow-lg border-0 rounded-4 mb-5">

            <div class="card-body p-4">

                <div class="row">

                    <div class="col-md-5">

                        <label class="form-label">
                            Избери специалност
                        </label>

                        <select id="specialty" class="form-select">

                            <option value="">-- Избери --</option>
                            
                            <option value="Алерголог">Алерголог</option>
                            <option value="Гастроентеролог">Гастроентеролог</option>
                            <option value="Дерматолог">Дерматолог</option>
                            <option value="Ендокринолог">Ендокринолог</option>
                            <option value="Зъболекар">Зъболекар</option>
                            <option value="Кардиолог">Кардиолог</option>
                            <option value="Невролог">Невролог</option>
                            <option value="Ортопед">Ортопед</option>
                            <option value="Офталмолог">Офталмолог</option>
                            <option value="Педиатър">Педиатър</option>
                            <option value="УНГ">УНГ</option>
                            <option value="Хирург">Хирург</option>
                        </select>

                    </div>

                    <div class="col-md-5">

                        <label class="form-label">
                            Избери град
                        </label>

                        <select id="city" class="form-select">

                            <option value="">-- Избери --</option>

                            <option value="Варна">Варна</option>
                            <option value="Пловдив">Пловдив</option>
                            <option value="София">София</option>
                            
                        </select>

                    </div>

                    <div class="col-md-2 d-flex align-items-end">

                        <button
                            class="btn btn-primary w-100"
                            onclick="searchDoctors()"
                        >
                            Търси
                        </button>

                    </div>

                </div>

            </div>

        </div>

        <h2 class="mb-4">
            Намерени лекари
        </h2>

        <div id="results" class="row gy-4"></div>

    </div>

    <script>

        const username = localStorage.getItem("username");

        if (!username) {
            window.location.href = "/";
        }

        async function searchDoctors() {

            const specialty =
                document.getElementById("specialty").value;

            const city =
                document.getElementById("city").value;

            const response = await fetch("/doctors");

            const doctors = await response.json();

            const results =
                document.getElementById("results");

            results.innerHTML = "";

            doctors.forEach(doc => {

                if (
                    doc.specialty === specialty &&
                    doc.city === city
                ) {

                    const card = document.createElement("div");

                    card.className = "col-md-6";

                    card.innerHTML = `
                        <div class="card shadow border-0 rounded-4 h-100">

                            <div class="card-body">

                                <h4 class="text-primary">
                                    ${doc.name}
                                </h4>

                                <p class="mb-2">
                                    <strong>Специалност:</strong>
                                    ${doc.specialty}
                                </p>

                                <p class="mb-2">
                                    <strong>Град:</strong>
                                    ${doc.city}
                                </p>

                                <p class="mb-2">
                                    ⭐ ${doc.rating} / 5
                                </p>

                                <p>
                                    ${doc.description}
                                </p>

                                <button
                                    class="btn btn-outline-primary"
                                    onclick="openDoctor(${doc.id})"
                                >
                                    Виж профил
                                </button>

                            </div>

                        </div>
                    `;

                    results.appendChild(card);
                }
            });

            if (results.innerHTML === "") {

                results.innerHTML = `
                    <div class="alert alert-warning">
                        Няма намерени лекари.
                    </div>
                `;
            }
        }

        function openDoctor(id) {

            window.location.href =
                `/doctor/${id}`;
        }

        function logout() {

            localStorage.removeItem("username");

            window.location.href = "/";
        }

        function openProfile() {
            window.location.href = "/my-profile";
        }

    </script>

</body>
</html>
