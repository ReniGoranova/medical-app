<!DOCTYPE html>
<html>
<head>
    <title>Данни на пациента</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container py-5">

        <div class="card shadow-lg border-0 rounded-4">

            <div class="card-body p-5">

                <h1 class="text-primary mb-4">
                    Данни на пациента
                </h1>

                <p class="mb-4">
                    За себе си ли запазвате час или за друг човек?
                </p>

                <div class="mb-4">

                    <label class="form-label">Име</label>

                    <input
                        type="text"
                        id="patientName"
                        class="form-control"
                        placeholder="Име и фамилия"
                    >

                </div>

                <div class="mb-4">

                    <label class="form-label">Телефон</label>

                    <input
                        type="text"
                        id="patientPhone"
                        class="form-control"
                        placeholder="+359..."
                    >

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Бележка към резервацията
                    </label>

                    <textarea
                        id="note"
                        rows="5"
                        class="form-control"
                        placeholder="Напишете бележка към лекаря (не е задължително)"
                    ></textarea>

                </div>

                <div class="card border-0 bg-light rounded-4 mb-4">

                    <div class="card-body">

                        <h4 class="text-primary mb-3">
                            Данни за резервацията
                        </h4>

                        <p>
                            <strong>Лекар:</strong>
                            <span id="doctorName"></span>
                        </p>

                        <p>
                            <strong>Специалност:</strong>
                            <span id="doctorSpecialty"></span>
                        </p>

                        <p>
                            <strong>Дата:</strong>
                            <span id="appointmentDate"></span>
                        </p>

                        <p>
                            <strong>Час:</strong>
                            <span id="appointmentTime"></span>
                        </p>

                    </div>

                </div>

                <button
                    class="btn btn-success w-100"
                    onclick="finishBooking()"
                >
                    Завърши резервацията
                </button>

            </div>

        </div>

    </div>

    <script>

        const bookingData =
            JSON.parse(localStorage.getItem("bookingData"));

        if (!bookingData) {
            window.location.href = "/search";
        }

        document.getElementById("doctorName").innerText =
            bookingData.doctor_name;

        document.getElementById("doctorSpecialty").innerText =
            bookingData.specialty;

        document.getElementById("appointmentDate").innerText =
            bookingData.date;

        document.getElementById("appointmentTime").innerText =
            bookingData.time;

        async function finishBooking() {

            const patientName =
                document.getElementById("patientName").value;

            const patientPhone =
                document.getElementById("patientPhone").value;

            const note =
                document.getElementById("note").value;

            if (patientName === "" || patientPhone === "") {

                alert("Попълни име и телефон");

                return;
            }

            const fullReason =
                `${bookingData.reason}; ${bookingData.payment}; ${bookingData.patientType}; Пациент: ${patientName}; Телефон: ${patientPhone}; Бележка: ${note}`;

            const fullDateTime =
                `${bookingData.date} ${bookingData.time}`;

            const response = await fetch(
                `/appointments?user=${bookingData.username}&doctor_id=${bookingData.doctor_id}&time=${encodeURIComponent(fullDateTime)}&reason=${encodeURIComponent(fullReason)}`,
                {
                    method: "POST"
                }
            );

            const data = await response.json();

            alert(data.message);

            if (data.message === "Часът е записан успешно") {

                localStorage.removeItem("bookingData");

                window.location.href = "/my-profile";
            }
        }

    </script>

</body>
</html>
