<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Регистрация - Medical App</title>

    <link rel="icon" type="image/png" href="/static/favicon.png">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="/static/style.css?v=900">
</head>

<body>

    <div class="container register-container">

        <div class="row justify-content-center">

            <div class="col-12 col-md-10 col-lg-8">

                <div class="card shadow-lg border-0 rounded-4 register-card">

                    <div class="card-body">

                        <h1 class="text-primary mb-3 register-title">
                            Регистрация
                        </h1>

                        <p class="text-muted mb-4 register-subtitle">
                            Създайте профил, за да можете да запазите час при лекар.
                        </p>

                        <div class="row g-3">

                            <div class="col-12 col-md-6">
                                <label class="form-label">
                                    Име
                                </label>

                                <input
                                    type="text"
                                    id="firstName"
                                    class="form-control"
                                    placeholder="Име"
                                >
                            </div>

                            <div class="col-12 col-md-6">
                                <label class="form-label">
                                    Фамилия
                                </label>

                                <input
                                    type="text"
                                    id="lastName"
                                    class="form-control"
                                    placeholder="Фамилия"
                                >
                            </div>

                        </div>

                        <div class="mt-3">
                            <label class="form-label">
                                Имейл
                            </label>

                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                placeholder="example@email.com"
                            >
                        </div>

                        <div class="mt-3">
                            <label class="form-label">
                                Телефон
                            </label>

                            <div class="input-group phone-input-group">
                                <span class="input-group-text">
                                    +359
                                </span>

                                <input
                                    type="tel"
                                    id="phone"
                                    class="form-control"
                                    placeholder="888123456"
                                    inputmode="numeric"
                                    pattern="[0-9]*"
                                    maxlength="9"
                                    autocomplete="tel"
                                >
                            </div>

                            <small class="text-muted">
                                Въведете 9 цифри, например: 888123456
                            </small>
                        </div>

                        <div class="row g-3 mt-1">

                            <div class="col-12 col-md-4">
                                <label class="form-label">
                                    Област
                                </label>

                                <select id="city" class="form-select">
                                    <option value="">Избери област...</option>
                                    <option value="Благоевград">Благоевград</option>
                                    <option value="Бургас">Бургас</option>
                                    <option value="Варна">Варна</option>
                                    <option value="Велико Търново">Велико Търново</option>
                                    <option value="Видин">Видин</option>
                                    <option value="Враца">Враца</option>
                                    <option value="Габрово">Габрово</option>
                                    <option value="Добрич">Добрич</option>
                                    <option value="Кърджали">Кърджали</option>
                                    <option value="Кюстендил">Кюстендил</option>
                                    <option value="Ловеч">Ловеч</option>
                                    <option value="Монтана">Монтана</option>
                                    <option value="Пазарджик">Пазарджик</option>
                                    <option value="Перник">Перник</option>
                                    <option value="Плевен">Плевен</option>
                                    <option value="Пловдив">Пловдив</option>
                                    <option value="Разград">Разград</option>
                                    <option value="Русе">Русе</option>
                                    <option value="Силистра">Силистра</option>
                                    <option value="Сливен">Сливен</option>
                                    <option value="Смолян">Смолян</option>
                                    <option value="София">София</option>
                                    <option value="София-област">София-област</option>
                                    <option value="Стара Загора">Стара Загора</option>
                                    <option value="Търговище">Търговище</option>
                                    <option value="Хасково">Хасково</option>
                                    <option value="Шумен">Шумен</option>
                                    <option value="Ямбол">Ямбол</option>
                                </select>
                            </div>

                            <div class="col-12 col-md-4">
                                <label class="form-label">
                                    Дата на раждане
                                </label>

                                <div class="row g-2">
                                    <div class="col-4">
                                        <select id="birthDay" class="form-select">
                                            <option value="">Ден</option>
                                        </select>
                                    </div>

                                    <div class="col-4">
                                        <select id="birthMonth" class="form-select">
                                            <option value="">Месец</option>
                                        </select>
                                    </div>

                                    <div class="col-4">
                                        <select id="birthYear" class="form-select">
                                            <option value="">Година</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="col-12 col-md-4">
                                <label class="form-label">
                                    Пол
                                </label>

                                <select id="gender" class="form-select">
                                    <option value="">Избери...</option>
                                    <option value="Жена">Жена</option>
                                    <option value="Мъж">Мъж</option>
                                    <option value="Предпочитам да не казвам">Предпочитам да не казвам</option>
                                </select>
                            </div>

                        </div>

                        <hr class="my-4">

                        <div class="mb-3">
                            <label class="form-label">
                                Потребителско име
                            </label>

                            <input
                               type="text"
                               id="username"
                               class="form-control"
                               placeholder="Например: ivan_00"
                            >

                            <small class="text-muted">
                                Пример: reni_2003, maria.petkova или ivan123
                            </small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Парола
                            </label>

                            <input
                                type="password"
                                id="password"
                                class="form-control"
                                placeholder="Парола"
                            >

                            <small class="text-muted">
                                Паролата трябва да е минимум 6 символа и да съдържа поне един специален знак.
                            </small>
                        </div>

                        <div class="form-check mb-2">
                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="terms"
                            >

                            <label class="form-check-label" for="terms">
                                Съгласен/съгласна съм с условията за ползване
                            </label>
                        </div>

                        <div class="form-check mb-4">
                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="privacy"
                            >

                            <label class="form-check-label" for="privacy">
                                Съгласен/съгласна съм с политиката за поверителност
                            </label>
                        </div>

                        <button
                            class="btn btn-success w-100 mb-3 register-button"
                            onclick="register()"
                        >
                            Регистрация
                        </button>

                        <button
                            class="btn btn-outline-secondary w-100"
                            onclick="goLogin()"
                        >
                            Вече имам профил
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>
        async function register() {
            const firstName = document.getElementById("firstName").value.trim();
            const lastName = document.getElementById("lastName").value.trim();
            const email = document.getElementById("email").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const city = document.getElementById("city").value;

            const birthDay = document.getElementById("birthDay").value;
            const birthMonth = document.getElementById("birthMonth").value;
            const birthYear = document.getElementById("birthYear").value;

            const birthDate =
                birthYear && birthMonth && birthDay
                    ? `${birthYear}-${birthMonth}-${birthDay}`
                    : "";

            const gender = document.getElementById("gender").value;
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            const terms = document.getElementById("terms").checked;
            const privacy = document.getElementById("privacy").checked;

            if (
                firstName === "" ||
                lastName === "" ||
                email === "" ||
                phone === "" ||
                city === "" ||
                birthDate === "" ||
                gender === "" ||
                username === "" ||
                password === ""
            ) {
                alert("Попълни всички полета");
                return;
            }

            const phonePattern = /^[0-9]{9}$/;

            if (!phonePattern.test(phone)) {
                alert("Телефонният номер трябва да съдържа точно 9 цифри");
                return;
            }

            const specialSymbolPattern = /[!@#$%^&*(),.?":{}|<>_\-+=\[\]\\\/;'`~]/;

            if (password.length < 6) {
                alert("Паролата трябва да е минимум 6 символа");
                return;
            }

            if (!specialSymbolPattern.test(password)) {
                alert("Паролата трябва да съдържа поне един специален знак");
                return;
            }

            if (!terms || !privacy) {
                alert("Трябва да се съгласиш с условията и политиката за поверителност");
                return;
            }

            const response = await fetch("/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    first_name: firstName,
                    last_name: lastName,
                    email: email,
                    phone: "+359 " + phone,
                    city: city,
                    birth_date: birthDate,
                    gender: gender,
                    username: username,
                    password: password
                })
            });

            const data = await response.json();

            alert(data.message);

            if (data.message === "Успешна регистрация") {
                window.location.href = "/";
            }
        }

        function goLogin() {
            window.location.href = "/";
        }

        function fillBirthDateSelects() {
            const birthDay = document.getElementById("birthDay");
            const birthMonth = document.getElementById("birthMonth");
            const birthYear = document.getElementById("birthYear");

            for (let day = 1; day <= 31; day++) {
                const option = document.createElement("option");
                option.value = String(day).padStart(2, "0");
                option.textContent = day;
                birthDay.appendChild(option);
            }

            for (let month = 1; month <= 12; month++) {
                const option = document.createElement("option");
                option.value = String(month).padStart(2, "0");
                option.textContent = month;
                birthMonth.appendChild(option);
            }

            const currentYear = new Date().getFullYear();

            for (let year = currentYear; year >= 1920; year--) {
                const option = document.createElement("option");
                option.value = year;
                option.textContent = year;
                birthYear.appendChild(option);
            }
        }

        const phoneInput = document.getElementById("phone");

        phoneInput.addEventListener("input", function () {
            this.value = this.value.replace(/\D/g, "").slice(0, 9);
        });

        phoneInput.addEventListener("paste", function (event) {
            event.preventDefault();

            const pastedText = event.clipboardData.getData("text");
            this.value = pastedText.replace(/\D/g, "").slice(0, 9);
        });

        fillBirthDateSelects();
    </script>

</body>
</html>
