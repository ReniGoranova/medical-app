<!DOCTYPE html>
<html>
<head>
    <title>Моят профил</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container py-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="text-primary">Моят профил</h1>

            <button class="btn btn-outline-secondary" onclick="goBack()">
                Назад
            </button>
        </div>

        <div class="row g-4">

            <div class="col-md-5">

                <div class="card shadow-lg border-0 rounded-4 mb-4">
                    <div class="card-body p-4 text-center">

                        <div class="profile-avatar">
                            👤
                        </div>

                        <h3 class="mt-3" id="fullName"></h3>
                        <p class="text-muted" id="profileUsername"></p>

                    </div>
                </div>

                <div class="card shadow border-0 rounded-4">
                    <div class="card-body p-4">

                        <h4 class="mb-4">Лични данни</h4>

                        <label class="form-label">Име</label>
                        <input type="text" id="firstName" class="form-control mb-3" disabled>

                        <label class="form-label">Фамилия</label>
                        <input type="text" id="lastName" class="form-control mb-3" disabled>

                        <label class="form-label">Имейл</label>
                        <input type="email" id="email" class="form-control mb-3">

                        <label class="form-label">Телефон</label>
                        <input type="text" id="phone" class="form-control mb-3">

                        <label class="form-label">Град</label>
                        <input type="text" id="city" class="form-control mb-3" disabled>

                        <label class="form-label">Дата на раждане</label>
                        <input type="text" id="birthDate" class="form-control mb-3" disabled>

                        <label class="form-label">Пол</label>
                        <input type="text" id="gender" class="form-control mb-4" disabled>

                        <button class="btn btn-success w-100" onclick="saveProfile()">
                            Запази промените
                        </button>

                    </div>
                </div>

            </div>

            <div class="col-md-7">

                <div class="card shadow border-0 rounded-4 mb-4">
                    <div class="card-body p-4">

                        <h4 class="text-primary mb-3">
                            Моите предстоящи резервации
                        </h4>

                        <div id="upcomingAppointments"></div>

                    </div>
                </div>

                <div class="card shadow border-0 rounded-4">
                    <div class="card-body p-4">

                        <h4 class="text-primary mb-3">
                            Минали резервации
                        </h4>

                        <div id="pastAppointments"></div>

                    </div>
                </div>

            </div>

        </div>

    </div>

    <script>
        const username = localStorage.getItem("username");

        if (!username) {
            window.location.href = "/";
        }

        async function loadProfile() {
            const response = await fetch(`/profile-data/${username}`);
            const user = await response.json();

            document.getElementById("firstName").value = user.first_name || "";
            document.getElementById("lastName").value = user.last_name || "";
            document.getElementById("email").value = user.email || "";
            document.getElementById("phone").value = user.phone || "";
            document.getElementById("city").value = user.city || "";
            document.getElementById("birthDate").value = user.birth_date || "";
            document.getElementById("gender").value = user.gender || "";

            document.getElementById("fullName").innerText =
                `${user.first_name || ""} ${user.last_name || ""}`;

            document.getElementById("profileUsername").innerText =
                user.username || "";
        }

        async function saveProfile() {
            const email = document.getElementById("email").value;
            const phone = document.getElementById("phone").value;

            if (email === "" || phone === "") {
                alert("Имейлът и телефонът не могат да бъдат празни");
                return;
            }

            const response = await fetch("/profile-update", {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: username,
                    email: email,
                    phone: phone
                })
            });

            const data = await response.json();

            alert(data.message);
        }

        async function loadAppointments() {
            const response = await fetch(`/my-appointments-data?username=${username}`);
            const appointments = await response.json();

            const upcomingBox = document.getElementById("upcomingAppointments");
            const pastBox = document.getElementById("pastAppointments");

            upcomingBox.innerHTML = "";
            pastBox.innerHTML = "";

            const today = new Date();

            appointments.forEach(app => {
                const appDate = new Date(app.time);

                const item = document.createElement("div");
                item.className = "profile-appointment-card";

                item.innerHTML = `
                <strong>${app.doctor_name}</strong>
                <br>
                
                ${app.specialty}
                
                <br>
                
                <span>${app.time}</span>
                
                <br>
                <small>${app.address}</small>
                
                <div class="mt-3">

                    <button
                       class="btn btn-outline-danger btn-sm"
                       onclick="cancelAppointment(${app.id})"
                    >
                       Отмени час
                    
                    </button>
                
                </div>
                `;

                if (appDate >= today) {
                    upcomingBox.appendChild(item);
                } else {
                    pastBox.appendChild(item);
                }
            });

            if (upcomingBox.innerHTML === "") {
                upcomingBox.innerHTML = `
                    <div class="alert alert-warning mb-0">
                        Нямате предстоящи резервации.
                    </div>
                `;
            }

            if (pastBox.innerHTML === "") {
                pastBox.innerHTML = `
                    <div class="alert alert-secondary mb-0">
                        Нямате минали резервации.
                    </div>
                `;
            }
        }

        function goBack() {
            window.history.back();
        }

        loadProfile();
        loadAppointments();

        async function cancelAppointment(id) {

    const confirmDelete = confirm(
        "Сигурни ли сте, че искате да отмените часа?"
    );

    if (!confirmDelete) {
        return;
    }

    const response = await fetch(`/appointments/${id}`, {
        method: "DELETE"
    });

    const data = await response.json();

    alert(data.message);

    loadAppointments();
}
    </script>

</body>
</html>
