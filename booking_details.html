<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Детайли за прегледа</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="/static/style.css?v=1002">
</head>

<body>

    <a class="app-logo" onclick="goHome()">
    <img src="/static/logo.png" alt="Medical App" class="app-logo-img">
    </a>

    <div class="container booking-details-container">

        <div class="d-flex justify-content-between align-items-center mb-4 booking-header">
            <h1 class="text-primary mb-0">
                Детайли за прегледа
            </h1>

            <button class="btn btn-outline-secondary back-button" onclick="goBack()">
                Назад
            </button>
        </div>

        <div class="row g-4">

            <div class="col-12 col-md-7">

                <div class="card shadow border-0 rounded-4 booking-form-card">
                    <div class="card-body">

                        <div class="alert alert-warning">
                            <strong>Важно</strong>
                            <ul class="mb-0 mt-2">
                                <li>Моля, попълнете данните преди потвърждение.</li>
                                <li>Запазеният час може да бъде отменен от секция „Моите часове“.</li>
                            </ul>
                        </div>

                        <label class="form-label mt-3">
                            Каква е причината за посещението?
                        </label>

                        <select id="reason" class="form-select mb-4">
                            <option value="">Избери...</option>
                            <option value="Първичен преглед">Първичен преглед</option>
                            <option value="Вторичен преглед">Вторичен преглед</option>
                            <option value="Контролен преглед">Контролен преглед</option>
                            <option value="Профилактичен преглед">Профилактичен преглед</option>
                            <option value="Консултация">Консултация</option>
                            <option value="Изследвания и резултати">Изследвания и резултати</option>
                        </select>

                        <label class="form-label">
                            Какъв метод на плащане избирате?
                        </label>

                        <select id="payment" class="form-select mb-4">
                            <option value="">Избери...</option>
                            <option value="Платен преглед">Платен преглед</option>
                            <option value="Преглед по НЗОК (направление/потребителска такса)">Преглед по НЗОК (направление/потребителска такса)</option>
                        </select>

                        <label class="form-label">
                            Посещавали ли сте този лекар преди?
                        </label>

                        <div class="form-check">
                            <input
                                class="form-check-input"
                                type="radio"
                                name="visitedBefore"
                                id="newPatient"
                                value="Нов пациент"
                                checked
                            >
                            <label class="form-check-label" for="newPatient">
                                Аз съм нов пациент
                            </label>
                        </div>

                        <div class="form-check mb-4">
                            <input
                                class="form-check-input"
                                type="radio"
                                name="visitedBefore"
                                id="oldPatient"
                                value="Посещавал съм лекаря преди"
                            >
                            <label class="form-check-label" for="oldPatient">
                                Посещавал съм го и преди
                            </label>
                        </div>

                        <button class="btn btn-primary w-100" onclick="goPatientDetails()">
                            Напред
                        </button>

                    </div>
                </div>

            </div>

            <div class="col-12 col-md-5">

                <div class="card shadow border-0 rounded-4 booking-summary-card">
                    <div class="card-body">

                        <h4 class="text-primary mb-3">
                            Обобщение
                        </h4>

                        <p><strong>Дата:</strong> <span id="summaryDate"></span></p>
                        <p><strong>Час:</strong> <span id="summaryTime"></span></p>

                        <hr>

                        <h5 id="summaryDoctor"></h5>
                        <p class="mb-1"><span id="summarySpecialty"></span></p>
                        <p>⭐ <span id="summaryRating"></span> / 5</p>

                        <hr>

                        <p><strong>Град:</strong> <span id="summaryCity"></span></p>
                        <p><strong>Адрес:</strong> <span id="summaryAddress"></span></p>
                        <p><strong>Телефон:</strong> <span id="summaryPhone"></span></p>

                        <hr>

                        <p><strong>Причина:</strong> <span id="summaryReason">-</span></p>
                        <p><strong>Плащане:</strong> <span id="summaryPayment">-</span></p>
                        <p><strong>Пациент:</strong> <span id="summaryPatient">Нов пациент</span></p>

                    </div>
                </div>

            </div>

        </div>

    </div>

    <script>
        const bookingData = JSON.parse(localStorage.getItem("bookingData"));

        if (!bookingData) {
            window.location.href = "/search";
        }

        document.getElementById("summaryDate").innerText = bookingData.date;
        document.getElementById("summaryTime").innerText = bookingData.time;
        document.getElementById("summaryDoctor").innerText = bookingData.doctor_name;
        document.getElementById("summarySpecialty").innerText = bookingData.specialty;
        document.getElementById("summaryRating").innerText = bookingData.rating;
        document.getElementById("summaryCity").innerText = bookingData.city;
        document.getElementById("summaryAddress").innerText = bookingData.address;
        document.getElementById("summaryPhone").innerText = bookingData.phone;

        document.getElementById("reason").addEventListener("change", function () {
            document.getElementById("summaryReason").innerText = this.value || "-";
        });

        document.getElementById("payment").addEventListener("change", function () {
            document.getElementById("summaryPayment").innerText = this.value || "-";
        });

        document.querySelectorAll("input[name='visitedBefore']").forEach(radio => {
            radio.addEventListener("change", function () {
                document.getElementById("summaryPatient").innerText = this.value;
            });
        });

        function goPatientDetails() {
            const reason = document.getElementById("reason").value;
            const payment = document.getElementById("payment").value;
            const patientType =
                document.querySelector("input[name='visitedBefore']:checked").value;

            if (reason === "") {
                alert("Избери причина за посещението");
                return;
            }

            if (payment === "") {
                alert("Избери метод на плащане");
                return;
            }

            bookingData.reason = reason;
            bookingData.payment = payment;
            bookingData.patientType = patientType;

            localStorage.setItem("bookingData", JSON.stringify(bookingData));

            window.location.href = "/patient-details";
        }

        function goHome() {
            window.location.href = "/search";
        }

        function goBack() {
            window.history.back();
        }
    </script>

</body>
</html>
